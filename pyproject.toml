[project]
name = "interventional-care-pathways"
version = "0.1.0"
description = "A local pathway analytics workbench that simulates ketamine/TMS-style treatment journeys, flags drop-off risk, and expla"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Tarun Aditya Kusupati" }
]
dependencies = []

[project.scripts]
interventional-care-pathways = "interventional_care_pathways.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
